version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy

    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=ticketing_db
      - DB_PORT=5432

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ticketing_db
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ticketing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: